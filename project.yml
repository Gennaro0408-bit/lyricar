name: Lyricar
options:
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lyricar:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/Lyricar.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Lyricar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lyricar
        CallbackScheme: $(CALLBACK_SCHEME)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        AppGroup: group.$(APP_BUNDLE_ID)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "Durante la guida Lyricar usa la posizione solo per restare attiva in background, così i testi su CarPlay restano sincronizzati anche dopo una telefonata. La posizione non viene salvata né inviata."
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [$(CALLBACK_SCHEME)]
    dependencies:
      - target: LyricsWidget
  LyricsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: Widget/LyricsWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Testi
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        AppGroup: group.$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
