name: Lyricar
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lyricar:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/Lyricar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Lyricar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lyricar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        CallbackScheme: $(CALLBACK_SCHEME)
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        AppGroup: group.$(APP_BUNDLE_ID)
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: "While you drive, Lyricar uses your location only to keep running in the background, so the lyrics on CarPlay stay in sync even after a phone call. Your location is never stored or sent anywhere."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [$(CALLBACK_SCHEME)]
    dependencies:
      - target: LyricsWidget
  LyricsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        CODE_SIGN_ENTITLEMENTS: Widget/LyricsWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Lyricar Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it]
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        AppGroup: group.$(APP_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
